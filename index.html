<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>BookChain — SwapSafe</title>

  <!-- CSS -->
  <link rel="stylesheet" href="css/reset.css" />
  <link rel="stylesheet" href="css/style.css" />

  <!-- Icons (Tabler, free & lightweight) -->
  <link rel="stylesheet"
    href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@latest/tabler-icons.min.css" />

  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600&family=DM+Serif+Display&display=swap"
    rel="stylesheet" />
</head>
<body>

  <!-- App shell — we'll fill this in Phase 2 -->
  <div id="app">

  <!-- NAVBAR -->
  <nav class="navbar">
    <div class="navbar__logo" onclick="showPage('browse')">
      <div class="navbar__logo-icon">
        <i class="ti ti-books"></i>
      </div>
      <div>
        <div class="navbar__logo-text">BookChain</div>
        <div class="navbar__logo-sub">SwapSafe</div>
      </div>
    </div>

    <div class="navbar__tabs" id="nav-tabs">
      <button class="navbar__tab active" data-page="browse">Browse</button>
      <button class="navbar__tab" data-page="swaps">My Swaps</button>
      <button class="navbar__tab" data-page="list">List a Book</button>
      <button class="navbar__tab" data-page="profile">Profile</button>
    </div>

    <div class="navbar__right">
      <button class="navbar__icon-btn" aria-label="Notifications">
        <i class="ti ti-bell"></i>
        <span class="navbar__notif-dot"></span>
      </button>
      <div class="navbar__avatar">AK</div>
    </div>
  </nav>

  <!-- PAGES -->
  <div id="page-browse"  class="page active"><h2>Browse — coming Phase 3</h2></div>
  <div id="page-swaps"   class="page"><h2>Swaps — coming Phase 5</h2></div>
  <div id="page-list"    class="page"><h2>List a Book — coming Phase 4</h2></div>
  <div id="page-profile" class="page"><h2>Profile — coming Phase 6</h2></div>

</div>

  <!-- JS -->
  <script src="js/data.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
