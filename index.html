<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>BookChain — SwapSafe</title>

  <!-- CSS -->
  <link rel="stylesheet" href="css/reset.css" />
  <link rel="stylesheet" href="css/style.css" />

  <!-- Icons (Tabler, free & lightweight) -->
  <link rel="stylesheet"
    href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@latest/tabler-icons.min.css" />

  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600&family=DM+Serif+Display&display=swap"
    rel="stylesheet" />
</head>
<body>

  <!-- App shell — we'll fill this in Phase 2 -->
  <div id="app">

  <!-- NAVBAR -->
  <nav class="navbar">
    <div class="navbar__logo" onclick="showPage('browse')">
      <div class="navbar__logo-icon">
        <i class="ti ti-books"></i>
      </div>
      <div>
        <div class="navbar__logo-text">BookChain</div>
        <div class="navbar__logo-sub">SwapSafe</div>
      </div>
    </div>

    <div class="navbar__tabs" id="nav-tabs">
      <button class="navbar__tab active" data-page="browse">Browse</button>
      <button class="navbar__tab" data-page="swaps">My Swaps</button>
      <button class="navbar__tab" data-page="list">List a Book</button>
      <button class="navbar__tab" data-page="profile">Profile</button>
    </div>

    <div class="navbar__right">
      <button class="navbar__icon-btn" aria-label="Notifications">
        <i class="ti ti-bell"></i>
        <span class="navbar__notif-dot"></span>
      </button>
      <div class="navbar__avatar">AK</div>
    </div>
  </nav>

  <!-- PAGES -->
   <div id="page-browse" class="page active">

  <!-- Hero -->
  <div class="browse-hero">
    <h1 class="browse-hero__title">Find your next textbook — free.</h1>
    <p class="browse-hero__sub">Swap directly with fellow students. No middleman, no fees.</p>

    <!-- Search + filter row -->
    <div class="browse-search-row">
      <div class="search-wrap">
        <i class="ti ti-search search-wrap__icon"></i>
        <input
          type="text"
          id="search-input"
          class="search-wrap__input"
          placeholder="Search by title, author, or subject…"
          oninput="filterBooks()"
        />
      </div>
      <select id="subject-filter" class="filter-select" onchange="filterBooks()">
        <option value="">All subjects</option>
        <option>Computer Science</option>
        <option>Mathematics</option>
        <option>Physics</option>
        <option>Biology</option>
        <option>Economics</option>
        <option>Engineering</option>
      </select>
    </div>
  </div>

  <!-- Stats strip -->
  <div class="stats-strip">
    <div class="stats-strip__item">
      <div class="stats-strip__num">1,240</div>
      <div class="stats-strip__lbl">books listed</div>
    </div>
    <div class="stats-strip__item">
      <div class="stats-strip__num">380</div>
      <div class="stats-strip__lbl">active swappers</div>
    </div>
    <div class="stats-strip__item">
      <div class="stats-strip__num">₹4.2L</div>
      <div class="stats-strip__lbl">saved collectively</div>
    </div>
    <div class="stats-strip__item">
      <div class="stats-strip__num">872</div>
      <div class="stats-strip__lbl">successful swaps</div>
    </div>
  </div>

  <!-- Condition filter pills -->
  <div class="browse-toolbar">
    <div class="pills" id="condition-pills">
      <button class="pill active" data-condition="">All</button>
      <button class="pill" data-condition="like-new">Like New</button>
      <button class="pill" data-condition="good">Good</button>
      <button class="pill" data-condition="fair">Fair</button>
    </div>
  </div>

  <!-- Book grid -->
  <div class="book-grid" id="book-grid"></div>

</div>
  <div id="page-swaps"   class="page"><h2>Swaps — coming Phase 5</h2></div>
  <div id="page-list"    class="page"><h2>List a Book — coming Phase 4</h2></div>
  <div id="page-profile" class="page"><h2>Profile — coming Phase 6</h2></div>

</div>

  <!-- JS -->
  <script src="js/data.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
