name: CI

on:
  push:
    branches: [fullstack-upgrade]
  pull_request:
    branches: [fullstack-upgrade]

jobs:
  test:
    name: Syntax checks and model tests
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Check JavaScript syntax
        run: npm run check

      - name: Run automated tests
        run: npm test
